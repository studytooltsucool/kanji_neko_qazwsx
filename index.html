<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>にゃんこ漢字よみ</title>
<style>
/* パステルの こねこ部屋。いちごミルク色の地に、白いカードとパステルのボタン。1画面アプリ */
:root{
  --night:#fff7fa;
  --night-2:#fdeef5;
  --panel:#ffffff;
  --line:#f5cfe0;
  --ink:#5b4052;
  --ink-soft:#a08595;
  --pink:#f48bb8;
  --pink-deep:#e2679f;
  --cyan:#a8def0;
  --lemon:#ffe29a;
  --mint:#aee9c9;
  --miss:#ffaaaa;
  --lav:#e6dcfa;
  --accent-ink:#e2679f;
  --tile:#ffffff;
  --tile-ink:#5b4052;
  --font-display:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-kanji:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font-body);font-weight:500;letter-spacing:.02em;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(circle at 15% 8%,rgba(255,190,220,.45),transparent 40%),
   radial-gradient(circle at 88% 28%,rgba(190,225,250,.45),transparent 40%),
   radial-gradient(circle at 50% 100%,rgba(255,235,170,.45),transparent 50%),
   radial-gradient(circle,rgba(244,139,184,.12) 1.5px,transparent 2px) 0 0/22px 22px;
  transition:filter .4s}
body.fever::before{animation:feverbg 1.2s linear infinite}
@keyframes feverbg{to{filter:hue-rotate(360deg) saturate(1.3)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column}
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.screen{display:flex;flex-direction:column;gap:14px;flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent-ink);font-size:15px}
.iconbtn{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.iconbtn[aria-pressed="false"]{opacity:.55}

/* title */
.logo{font-family:var(--font-display);text-align:center;line-height:1.05;margin-top:4px}
.logo .s{display:block;font-size:15px;color:var(--accent-ink);letter-spacing:.2em}
.logo .b{display:block;font-size:clamp(34px,10vw,48px);color:var(--pink-deep);font-weight:700;letter-spacing:.04em;text-shadow:0 3px 0 #fff,0 4px 0 var(--line)}
.stage{position:relative;background:linear-gradient(180deg,#fff,var(--night-2));border:3px solid var(--line);border-radius:28px;padding:10px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
.stage .spot{position:absolute;inset:auto 10% -40px;height:90px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,225,77,.35),transparent 70%)}
.cat{width:min(230px,60vw);aspect-ratio:1;max-width:100%;position:relative;cursor:pointer}
.cat svg{width:100%;height:100%;overflow:visible;animation:bob 2.2s ease-in-out infinite}
.cat.jump svg{animation:jump .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes jump{40%{transform:translateY(-34px) scale(1.06,.94)}70%{transform:translateY(0) scale(1.08,.9)}}
.eyes{transform-origin:100px 97px;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.catname{font-family:var(--font-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.catname input{font:inherit;font-size:20px;width:7.5em;text-align:center;background:transparent;color:var(--ink);border:0;border-bottom:2px dashed var(--line);padding:2px}
.rank{font-size:13px;color:var(--accent-ink);letter-spacing:.1em}
.xpwrap{width:100%;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.lv{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--accent-ink);min-width:3.6em}
.xpbar{flex:1;height:16px;border-radius:999px;background:var(--night);border:2px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lemon));border-radius:999px;transition:width .35s}
.xptxt{font-size:12px;color:var(--ink-soft);min-width:4.5em;text-align:right}
.big{font-family:var(--font-display);font-weight:700;text-shadow:0 1px 2px rgba(180,60,110,.35);font-size:26px;padding:18px;border-radius:22px;background:var(--pink);color:#fff;box-shadow:0 6px 0 #d9649b;letter-spacing:.06em;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #d9649b}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:17px;padding:14px;border-radius:18px;background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 #f1d3e2}
.sub:active{transform:translateY(3px);box-shadow:0 1px 0 #f1d3e2}
.range{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--night-2);border:2px solid var(--line);border-radius:18px;padding:5px}
.range button{padding:10px 4px;border-radius:13px;background:transparent;color:var(--ink-soft);font-size:15px}
.range button[aria-pressed="true"]{background:var(--cyan);color:var(--ink)}
.rangelbl{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:-6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.stats div{background:var(--night-2);border-radius:14px;padding:8px 4px;font-size:11px;color:var(--ink-soft)}
.stats b{display:block;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}

/* game */
.hud{display:flex;align-items:center;gap:10px}
.mini{width:58px;height:58px;flex:none}
.mini svg{width:100%;height:100%}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--night-2);border:2px solid var(--line)}
.dots i.ok{background:var(--mint);border-color:var(--accent-ink);box-shadow:0 0 8px var(--mint)}
.dots i.ng{background:var(--miss);border-color:var(--miss)}
.dots i.now{border-color:var(--accent-ink);transform:scale(1.25)}
.combo{font-family:var(--font-display);font-weight:700;text-align:right;line-height:1;min-width:76px}
.combo b{display:block;font-size:30px;color:var(--pink-deep)}
.combo span{font-size:11px;color:var(--ink-soft)}
.fevertag{display:none;font-family:var(--font-display);font-weight:700;text-align:center;font-size:20px;letter-spacing:.2em;background:linear-gradient(90deg,#f06aa8,#ff9f45,#4aa3c9,#f06aa8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 1s linear infinite}
body.fever .fevertag{display:block}
@keyframes slide{to{background-position:300% 0}}
.card{background:var(--tile);color:var(--tile-ink);border-radius:24px;padding:22px 18px 18px;box-shadow:0 6px 0 #f4d5e4,0 0 0 3px var(--line);position:relative;min-height:120px}
body.fever .card{box-shadow:0 6px 0 #f4d5e4,0 0 0 4px var(--pink),0 0 26px rgba(244,139,184,.6)}
.qno{position:absolute;top:-14px;left:16px;background:var(--cyan);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px}
.sentence{font-family:var(--font-kanji);font-weight:400;font-size:clamp(23px,6.6vw,30px);line-height:2.15;letter-spacing:.06em;word-break:normal;line-break:strict;overflow-wrap:anywhere}
.sentence ruby rt{font-family:var(--font-body);font-size:.42em;color:#a08595;letter-spacing:0}
.sentence .tgt{display:inline-block;color:#d61f7d;background:#fff;border:3px solid var(--pink);border-radius:10px;padding:0 4px;line-height:1.3;font-size:1.25em;animation:glow 1.2s ease-in-out infinite;margin:0 2px}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,79,168,.25)}}
.ask{font-size:15px;color:var(--ink-soft);margin-top:6px}
.slots{display:flex;justify-content:center;gap:8px;min-height:62px}
.slot{width:54px;height:60px;border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;font-size:32px;font-weight:400;background:#fff}
.slot.f{border-style:solid;border-color:var(--accent-ink);background:var(--tile);color:var(--tile-ink);animation:pop .18s}
.slots.ok .slot{border-color:var(--accent-ink);background:var(--mint);color:var(--ink)}
.slots.ng .slot{border-color:var(--miss);background:var(--miss);color:#fff}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{font-family:var(--font-kanji);font-size:clamp(28px,8.4vw,36px);font-weight:400;padding:10px 0;border-radius:18px;background:var(--tile);border:2px solid var(--line);color:var(--tile-ink);box-shadow:0 6px 0 #efc6da;transition:transform .08s,opacity .15s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #efc6da}
.tile:disabled{opacity:.18;transform:translateY(4px);box-shadow:none}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl .sub{font-size:15px;padding:10px}
.msg{min-height:26px;text-align:center;font-size:18px;color:var(--accent-ink)}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px}

/* result & lists */
h2{font-family:var(--font-display);font-weight:700;font-size:30px;text-align:center;margin:6px 0 0;text-wrap:balance}
.score{font-family:var(--font-display);font-weight:700;font-size:64px;text-align:center;line-height:1;color:var(--accent-ink)}
.score small{font-size:24px;color:var(--ink)}
.earn{text-align:center;color:var(--ink-soft);font-size:15px}
.earn b{color:var(--accent-ink);font-size:22px}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.z{aspect-ratio:1;display:grid;place-items:center;font-family:var(--font-kanji);font-size:22px;border-radius:10px;background:#f7eef3;color:#dcc7d3;border:2px solid transparent}
.z.on{background:#fff;color:var(--tile-ink);border-color:var(--line)}
.z.gold{background:var(--lemon);color:var(--ink);border-color:#f5c95a}
.zhead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft)}
.zhead b{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.item{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 4px;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.item.on{border-color:var(--accent-ink);box-shadow:0 0 12px rgba(255,225,77,.5)}
.item.lock{opacity:.4}
.item .stars{color:#f0a020;font-size:10px;letter-spacing:-1px}

.back{align-self:flex-start}
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--night-2);border:2px solid var(--line);border-radius:20px;padding:5px}
.modesw button{padding:12px 4px;border-radius:15px;background:transparent;color:var(--ink-soft);font-size:20px}
.modesw button[aria-pressed="true"]{background:var(--pink);color:#fff;text-shadow:0 1px 2px rgba(180,60,110,.35)}
.kms button{font-size:13px}
.credit{font-size:11px;color:var(--ink-soft);text-align:center;margin:0}
.credit a{color:var(--ink-soft)}
.kcard .sentence{font-size:clamp(21px,6vw,27px)}
.kbox{ruby-position:over}
.kbox rt{font-size:.5em;color:var(--pink-deep);font-family:var(--font-body);letter-spacing:0}
.kq{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border:3px solid var(--pink);border-radius:8px;background:#fff0f6;color:var(--pink-deep);margin:0 2px;line-height:1}
.kprog{display:inline-block;background:var(--night-2);border-radius:999px;padding:0 10px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.kpad{width:min(100%,380px);aspect-ratio:1;align-self:center;border-radius:18px;border:3px solid var(--line);box-shadow:0 6px 0 #f4d5e4;background:#fff;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden}
.kpad.kok{border-color:#7fd3a8}
.kpad svg{display:block;width:100%;height:100%;touch-action:none}
.kink{fill:none;stroke:#5b4052;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.kink.kbad{stroke:#ff8a8a;transition:opacity .4s;opacity:.6}
.kink.kgood{stroke:#3fae78}
.kref{fill:none;stroke:#5b4052;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.kref.pop{animation:kpop .25s}
@keyframes kpop{0%{stroke:#f48bb8;stroke-width:13}100%{stroke:#5b4052;stroke-width:8}}
.khint{fill:none;stroke:#f48bb8;stroke-width:9;stroke-linecap:round;stroke-dasharray:4 10;animation:khint 1s ease-in-out infinite}
@keyframes khint{50%{opacity:.35}}
.kstart{fill:#f48bb8}
.knum{font-size:15px;font-weight:700;fill:#e2679f;font-family:var(--font-body);paint-order:stroke;stroke:#fff;stroke-width:4px}
.kmiss{display:inline-block;background:#ffe9ee;border-radius:999px;padding:0 10px;font-size:13px;color:#d9607f;font-variant-numeric:tabular-nums}
.ctrl1{grid-template-columns:1fr}
.quit{flex:none;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--ink-soft)}
.ctrl3{grid-template-columns:1fr 1fr 1.3fr}
.ctrl3 .sub{font-size:13px;padding:10px 4px}
.kgo{background:var(--pink)!important;color:#fff;border-color:var(--pink)!important}
.roomwrap{width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--line);background:var(--night-2)}
.room{display:block;width:100%;height:auto}
#roomcat,.xcat{cursor:pointer}
.catbob{animation:bob 2.2s ease-in-out infinite}
.catbob.jump{animation:jump .55s cubic-bezier(.3,1.6,.5,1)}
.nameline{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.nextevo{font-size:13px;color:var(--ink-soft);text-align:center}
.nextevo b{color:var(--accent-ink);font-size:16px}
.breeds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;min-width:0}
.bcard svg{width:100%;max-width:92px;aspect-ratio:1}
.bcard[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--night-2);box-shadow:0 0 14px rgba(255,225,77,.45)}
.nminput{font:inherit;font-size:22px;text-align:center;width:min(260px,100%);box-sizing:border-box;background:var(--night);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px}
.nminput:focus{outline:3px solid var(--cyan);outline-offset:2px}
.nmlbl{font-size:13px;color:var(--ink-soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;display:flex;flex-direction:column;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;color:var(--ink-soft)}
.tabs button small{font-size:11px;font-variant-numeric:tabular-nums}
.tabs button[aria-pressed="true"]{background:var(--cyan);border-color:var(--accent-ink);color:var(--ink)}
.ib{width:100%;max-width:88px;height:64px;background:#fdeef5;border-radius:10px;display:grid;place-items:center;overflow:hidden;color:#8a7ab0;font-size:26px}
.ib svg{width:100%;height:100%}
.slotn{color:var(--ink-soft);font-size:10px}
.badge{width:180px;max-width:100%}
.badge svg{display:block;width:100%;height:auto}
.ovroom{width:100%;max-width:340px;border-radius:18px;overflow:hidden;border:3px solid var(--pink)}


/* overlays */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:49}
#flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.popword{position:fixed;left:50%;top:38%;z-index:60;pointer-events:none;font-family:var(--font-display);font-weight:700;white-space:nowrap;transform:translate(-50%,-50%);animation:popword 1s cubic-bezier(.2,1.6,.4,1) forwards;text-align:center;line-height:1.1}
@keyframes popword{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.fish{position:fixed;z-index:55;pointer-events:none;width:26px;height:16px;transition:transform .6s cubic-bezier(.5,-.3,.6,1),opacity .6s}
.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(255,244,249,.92);padding:16px;box-sizing:border-box}
.overlay[hidden]{display:none!important}
.rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,200,225,.45) 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ovbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:420px;width:100%}
.ovtitle{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,9vw,44px);color:var(--pink-deep);text-shadow:0 3px 0 #fff;animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.ovsub{font-size:18px;color:var(--ink)}
.capsule{width:150px;height:150px;border-radius:50%;background:linear-gradient(180deg,var(--pink) 50%,var(--tile) 50%);border:5px solid #fff;box-shadow:0 0 0 4px var(--line),0 8px 30px rgba(244,139,184,.45)}
.capsule.roll{animation:roll .18s linear infinite}
@keyframes roll{25%{transform:rotate(-14deg) translateY(-6px)}75%{transform:rotate(14deg) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div class="overlay" id="ov" hidden></div>

<script>
"use strict";
/* ============ 漢字リスト（1年80字・2年160字） ============ */
const G1="一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六";
const G2="引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話";

/* ============ 文章パーツ  {漢:よみ} は1文字ずつ ============ */

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function fill(fr){return fr.replace(/\[([A-Z]+)\]/g,(_,k)=>rnd(P[k]));}
function parse(s){
  const out=[];const re=/\{([^:{}]):([^{}]+)\}|([^{]+)/g;let m;
  while((m=re.exec(s))){ if(m[1]) out.push({k:m[1],r:m[2]}); else out.push({s:m[3]}); }
  return out;
}
/* 全パーツから「この漢字の読み方いろいろ」を集める（まちがい選択肢に使う） */

/* ============ ひらがな9択 ============ */
const HIRA="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
const PAIRS=["かが","きぎ","くぐ","けげ","こご","さざ","しじ","すず","せぜ","そぞ","ただ","ちぢ","つづっ","てで","とど","はばぱ","ひびぴ","ふぶぷ","へべぺ","ほぼぽ","やゃ","ゆゅ","よょ","ぬめ","ねれわ","るろ","さち","はほけ","いり","こに","あおめ","うら","しつ"];
function confuse(c){const o=[];for(const p of PAIRS){if(p.includes(c))for(const x of p)if(x!==c)o.push(x);}return o;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeTiles(ans,k){
  const need=[...ans];const set=new Set(need);const extra=[];
  const add=c=>{if(c&&!set.has(c)&&!extra.includes(c)&&extra.length<9-need.length)extra.push(c);};
  shuffle([...(READS[k]||[])]).forEach(r=>[...r].forEach(add));
  need.forEach(c=>shuffle(confuse(c)).slice(0,2).forEach(add));
  while(extra.length<9-need.length) add(rnd(HIRA));
  return shuffle(need.concat(extra));
}

const at=o=>Object.entries(o||{}).map(([k,v])=>` ${k}="${v}"`).join("");
const Rc=(x,y,w,h,f,o)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${at(o)}/>`;
const C=(x,y,r,f,o)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${at(o)}/>`;
const E=(x,y,rx,ry,f,o)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${at(o)}/>`;
const Pa=(d,f,o)=>`<path d="${d}" fill="${f}"${at(o)}/>`;
const LG=(id,stops,h)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="${h?1:0}" y2="${h?0:1}">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join("")}</linearGradient></defs>`;
const STAR=(x,y,s,f,o)=>Pa(`M${x} ${y-s} L${x+s*.3} ${y-s*.3} L${x+s} ${y} L${x+s*.3} ${y+s*.3} L${x} ${y+s} L${x-s*.3} ${y+s*.3} L${x-s} ${y} L${x-s*.3} ${y-s*.3}Z`,f,o);
const STAR5=(x,y,s,f,o)=>{let d="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s;d+=(i?"L":"M")+(x+Math.cos(a)*r).toFixed(1)+" "+(y+Math.sin(a)*r).toFixed(1);}return Pa(d+"Z",f,o);};
function seeded(n){let s=n;return()=>((s=(s*9301+49297)%233280)/233280);}
function dots(seed,n,x0,y0,w,h,fn){const r=seeded(seed);let o="";for(let i=0;i<n;i++)o+=fn(x0+r()*w,y0+r()*h,r());return o;}
const tree=(x,b,h,c)=>Rc(x-4,b-14,8,14,"#7a4a2a")+Pa(`M${x} ${b-h} L${x-h*.42} ${b-12} H${x+h*.42}Z`,c)+Pa(`M${x} ${b-h-14} L${x-h*.32} ${b-h*.45} H${x+h*.32}Z`,c);
const cloud=(x,y,s,f="#fff")=>C(x,y,12*s,f)+C(x+14*s,y-6*s,15*s,f)+C(x+30*s,y,12*s,f)+Rc(x,y,30*s,12*s,f);

/* ============ ねこ本体（シンプル線画スタイル） ============ */
let catUid=0;
function catG(lv,eq,opt={}){
 eq=eq||{};const u=++catUid;
 const st=stageOf(lv),B=breedOf(opt.breed||S.breed);
 const F=B.fur,D=B.dark,W=B.belly,O=B.ol,p=B.pat,P2=B.p2||D;
 const LW=5.5;
 const sw=`stroke="${O}" stroke-width="${LW}" stroke-linejoin="round" stroke-linecap="round"`;
 const sl=s=>eq[s]?accSVG(eq[s]):"";
 const earL=(p==="point"||p==="calico")?D:F, earR=p==="point"?D:p==="calico"?P2:F;
 const pink=B.dk?"#d98ea4":"#f7a6ae";
 const HEAD="M100 44 C140 44 160 66 160 94 C160 122 134 138 100 138 C66 138 40 122 40 94 C40 66 60 44 100 44Z";
 const BODY="M68 124 C60 150 60 176 66 192 H134 C140 176 140 150 132 124Z";
 /* みみ */
 const EL="M50 80 C44 50 48 30 58 24 C66 20 84 34 96 46";
 const ELF="M50 80 C44 50 48 30 58 24 C66 20 84 34 96 46 L80 70Z";
 const EI="M58 62 C55 46 57 36 62 34 C67 33 76 40 82 47Z";
 const mirX=d=>d.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g,(m,x,y)=>`${(200-parseFloat(x))} ${y}`);
 const ears=B.fold
  ?`<path d="M48 76 C46 56 58 46 82 50 C74 62 62 70 48 76Z" fill="${earL}" ${sw}/><path d="${mirX("M48 76 C46 56 58 46 82 50 C74 62 62 70 48 76Z")}" fill="${earR}" ${sw}/>`
  :`<path d="${ELF}" fill="${earL}"/><path d="${EL}" fill="none" ${sw}/><path d="${mirX(ELF)}" fill="${earR}"/><path d="${mirX(EL)}" fill="none" ${sw}/>
    <path d="${EI}" fill="${pink}"/><path d="${mirX(EI)}" fill="${pink}"/>`;
 /* もよう */
 let headPat="",bodyPat="",tailCol=F,tailStripe="";
 const bar=(d,w=8)=>`<path d="${d}" stroke="${D}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
 if(p==="tabby"){headPat=bar("M88 50 V64")+bar("M100 47 V66")+bar("M112 50 V64");bodyPat=bar("M134 146 H120")+bar("M136 160 H122")+bar("M66 152 H76",7);tailStripe=D;}
 if(p==="calico"){headPat=`<ellipse cx="62" cy="64" rx="26" ry="22" fill="${D}"/><ellipse cx="142" cy="70" rx="18" ry="16" fill="${P2}"/>`;bodyPat=`<ellipse cx="132" cy="156" rx="16" ry="14" fill="${D}"/><ellipse cx="68" cy="176" rx="12" ry="10" fill="${P2}"/>`;tailCol=D;}
 if(p==="point"){headPat=`<ellipse cx="100" cy="108" rx="30" ry="22" fill="${D}" opacity=".8"/>`;tailCol=D;}
 if(p==="tuxedo"){headPat=`<path d="M100 60 L80 112 Q100 146 120 112Z" fill="${W}"/><ellipse cx="100" cy="122" rx="30" ry="20" fill="${W}"/>`;}
 /* め */
 const er=st.baby?1.2:1;
 const eye=x=>`<ellipse cx="${x}" cy="97" rx="${7.5*er}" ry="${9.5*er}" fill="${B.eyec||"#4a2c1e"}"/><circle cx="${x+2.6*er}" cy="${97-3.6*er}" r="${2.6*er}" fill="#fff"/>`;
 const eyes=opt.sad
  ?`<path d="M71 91 L84 97 L71 103 M129 91 L116 97 L129 103" stroke="${O}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
  :opt.happy
  ?`<path d="M70 100 Q78 89 86 100 M114 100 Q122 89 130 100" stroke="${O}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`
  :eye(78)+eye(122);
 /* そうしょく */
 const head=sl("head")||(st.king?accSVG("crown"):st.prince?accSVG("circlet"):"");
 const back=sl("back")||(st.king?accSVG("royalcape"):"");
 const neck=sl("neck")||(st.king?accSVG("ermine"):"");
 const sparkle=lv>=15?'<g fill="#ffe14d">'+[[20,40],[178,60],[30,150],[172,170],[100,0]].map(([x,y],i)=>`<path transform="translate(${x},${y})" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="${i*.3}s" repeatCount="indefinite"/></path>`).join("")+'</g>':"";
 const glow=st.king?'<circle cx="100" cy="115" r="96" fill="none" stroke="#ffe14d" stroke-width="3" stroke-dasharray="6 10" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="0 100 115" to="360 100 115" dur="6s" repeatCount="indefinite"/></circle>':"";
 const curl=st.baby?`<path d="M97 45 q-3 -11 6 -12 q6 2 -1 8" stroke="${O}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`:"";
 const hT=st.baby?'transform="translate(100,112) scale(1.12) translate(-100,-112)"':"";
 const bT=st.baby?'transform="translate(100,192) scale(.82) translate(-100,-192)"':"";
 const TAIL="M132 186 C160 190 172 172 170 152 C168 136 156 130 150 140";
 return `<defs><radialGradient id="rb"><stop offset="0" stop-color="#ffe14d"/><stop offset=".45" stop-color="#ff4fa8"/><stop offset=".75" stop-color="#3ee6ff"/><stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/></radialGradient>
  <clipPath id="ch${u}"><path d="${HEAD}"/></clipPath><clipPath id="cb${u}"><path d="${BODY}"/></clipPath></defs>
 ${glow}${sparkle}
 <g transform="translate(100,195) scale(${st.sc}) translate(-100,-195)">
  ${sl("aura")}${back}
  <g ${bT}>
   <path d="${TAIL}" fill="none" stroke="${O}" stroke-width="${12+LW*2}" stroke-linecap="round"/>
   <path d="${TAIL}" fill="none" stroke="${tailCol}" stroke-width="12" stroke-linecap="round"/>
   ${tailStripe?`<path d="${TAIL}" fill="none" stroke="${tailStripe}" stroke-width="12" stroke-dasharray="6 10" stroke-dashoffset="-4"/>`:""}
   <path d="${BODY}" fill="${F}"/>
   <g clip-path="url(#cb${u})">${bodyPat}${p==="tuxedo"||p==="calico"?`<rect x="86" y="120" width="28" height="80" fill="${W}"/>`:`<ellipse cx="100" cy="170" rx="16" ry="26" fill="${W}" opacity=".7"/>`}</g>
   <path d="${BODY}" fill="none" ${sw}/>
   <path d="M86 150 V191 M114 150 V191" stroke="${O}" stroke-width="${LW}" stroke-linecap="round"/>
   <path d="M66 176 Q78 170 82 191 M134 176 Q122 170 118 191" stroke="${O}" stroke-width="${LW-1}" fill="none" stroke-linecap="round"/>
   <path d="M93 191 v-4 M107 191 v-4" stroke="${O}" stroke-width="3" stroke-linecap="round"/>
   ${p==="point"?`<path d="M88 182 h24" stroke="${D}" stroke-width="12" opacity=".7"/>`:""}
  </g>
  ${neck}
  <g ${hT}>
   ${ears}
   <path d="${HEAD}" fill="${F}"/>
   <g clip-path="url(#ch${u})">${headPat}</g>
   <path d="${HEAD}" fill="none" ${sw}/>
   ${curl}
   <g class="eyes">${eyes}</g>
   <circle cx="64" cy="112" r="10" fill="${pink}" opacity=".85"/><circle cx="136" cy="112" r="10" fill="${pink}" opacity=".85"/>
   <path d="M97.5 104 h5 l-2.5 3z" fill="${O}" stroke="${O}" stroke-width="2" stroke-linejoin="round"/>
   <path d="M90 109 Q95 116 100 109 Q105 116 110 109" stroke="${O}" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M46 102 L22 98 M46 110 L24 114 M154 102 L178 98 M154 110 L176 114" stroke="${O}" stroke-width="3.4" stroke-linecap="round"/>
   ${sl("face")}${head}
  </g>
  ${st.king?accSVG("scepter"):""}
 </g>`;
}
function catSVG(lv,eq,opt={}){return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="こねこ">${catG(lv,eq,opt)}</svg>`;}

/* ============ なかまの ねこ（レベルが 1 上がるごとに 1ぴき ふえる） ============ */
const FRIEND_SLOTS=(()=>{
 const rr=seeded(4242),out=[];
 /* ゆか → おく → かべ → てんじょう近く の じゅんに うめていく */
 const rows=[[250,64,5],[240,62,6],[214,56,7],[200,52,8],[176,48,8],[150,46,9],[124,44,9],[98,42,9],[72,40,10],[46,38,10]];
 rows.forEach(([y,w,n],ri)=>{
  const xs=[];for(let i=0;i<n;i++)xs.push((i+.5)*360/n+(rr()-.5)*18+(ri%2?14:-6));
  xs.forEach(x=>{
   if(ri<4&&x>150&&x<240&&y>196)return; /* しゅじんこうの まわりは あけておく */
   out.push({x,y:y+(rr()-.5)*8,w:w+(rr()-.5)*8,ord:ri*10+rr()*9.9});
  });
 });

/* ============ 音（BGM・効果音はすべてその場で合成） ============ */
let AC=null,master,bgmG,sfxG,noiseBuf,bgmOn=false,timer=null,nextT=0,step=0;
function audio(){
 if(AC)return AC;
 try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
 master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
 bgmG=AC.createGain();bgmG.gain.value=.55;bgmG.connect(master);
 sfxG=AC.createGain();sfxG.gain.value=.8;sfxG.connect(master);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 return AC;
}
const f=m=>440*Math.pow(2,(m-69)/12);
function tone(t,m,dur,type,vol,dest,slide){
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f(m),t);
 if(slide)o.frequency.exponentialRampToValueAtTime(f(m+slide),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function noise(t,dur,vol,hp,dest){
 const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;fl.type="highpass";fl.frequency.value=hp;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+.02);
}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(bgmG);o.start(t);o.stop(t+.2);}
/* オリジナル曲：C - Am - F - G をくり返す（8分音符×8が1小節） */
const N_=s=>s.split(" ").map(x=>x==="-"?0:+x);
const MEL=[N_("76 79 84 79 76 79 81 79"),N_("76 81 84 81 76 72 74 76"),N_("77 81 84 81 79 77 76 74"),N_("74 79 83 79 86 83 79 -"),
           N_("84 - 83 81 79 - 76 79"),N_("81 - 79 76 72 - 74 76"),N_("77 79 81 84 86 84 81 79"),N_("79 81 83 86 91 - 86 -")];
const ROOT=[48,45,41,43];const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
let fever=false;
function schedule(){
 const bpm=fever?176:148,eighth=60/bpm/2;
 while(nextT<AC.currentTime+.12){
  const bar=Math.floor(step/8)%8,b=step%8,ci=bar%4;
  const m=MEL[bar][b];if(m)tone(nextT,m+(fever?12:0),eighth*.9,"square",.07,bgmG);
  tone(nextT,ROOT[ci]+(b%2?12:0),eighth*.8,"triangle",.22,bgmG);
  if(b%4===0)kick(nextT);
  if(b%4===2)noise(nextT,.12,.25,1500,bgmG);
  noise(nextT,.03,.08,7000,bgmG);
  if(fever){const c=CH[ci];tone(nextT,c[b%3]+24,eighth*.45,"square",.035,bgmG);tone(nextT+eighth/2,c[(b+1)%3]+24,eighth*.45,"square",.035,bgmG);noise(nextT+eighth/2,.03,.07,7000,bgmG);}
  nextT+=eighth;step++;
 }
}
function startBGM(){if(!S.bgm||!audio())return;AC.resume();if(timer)return;nextT=AC.currentTime+.05;step=0;timer=setInterval(schedule,25);bgmOn=true;}
function stopBGM(){if(timer){clearInterval(timer);timer=null;}bgmOn=false;}
const SFX={
 tap(i){if(!S.sfx||!audio())return;tone(AC.currentTime,79+i,.07,"square",.12,sfxG);},
 back(){if(!S.sfx||!audio())return;tone(AC.currentTime,67,.08,"triangle",.2,sfxG,-5);},
 ok(c){if(!S.sfx||!audio())return;const t=AC.currentTime,base=72+Math.min(c,12);[0,4,7,12,16].forEach((x,i)=>tone(t+i*.055,base+x,.18,"square",.12,sfxG));noise(t,.25,.15,5000,sfxG);},
 ng(){if(!S.sfx||!audio())return;const t=AC.currentTime;tone(t,52,.3,"sawtooth",.15,sfxG,-6);tone(t+.12,48,.35,"sawtooth",.12,sfxG,-6);},
 lvup(){if(!S.sfx||!audio())return;const t=AC.currentTime;[72,76,79,84,79,84,88,91].forEach((m,i)=>tone(t+i*.09,m,.3,"square",.12,sfxG));tone(t+.75,96,.8,"triangle",.2,sfxG);},
 tick(){if(!S.sfx||!audio())return;tone(AC.currentTime,90,.03,"square",.08,sfxG);},
 rare(r){if(!S.sfx||!audio())return;const t=AC.currentTime;const seq=r>=4?[84,88,91,96,100,103]:[79,84,88];seq.forEach((m,i)=>tone(t+i*.08,m,.4,"triangle",.18,sfxG));noise(t,.6,.1,6000,sfxG);},
 purr(){if(!S.sfx||!audio())return;const t=AC.currentTime;tone(t,84,.12,"sine",.2,sfxG,4);tone(t+.13,88,.2,"sine",.2,sfxG,-7);}

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function rs(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}rs();addEventListener("resize",rs);
const COLS=["#ffb3d4","#a8def0","#ffe29a","#aee9c9","#d9c8ff","#ffc9a8"];
function burst(x,y,n,power=1){
 if(RM)n=Math.min(n,12);
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(4+Math.random()*9)*power;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5*power,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,s:5+Math.random()*7,c:rnd(COLS),star:Math.random()<.35,life:70+Math.random()*40});}
 if(!raf)raf=requestAnimationFrame(loop);
}
function rain(n){for(let i=0;i<n;i++)setTimeout(()=>burst(Math.random()*innerWidth,-20,3,.5),i*25);}
function loop(){
 const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(p=>p.life>0);
 for(const p of parts){p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
  cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;
  if(p.star){cx.beginPath();for(let i=0;i<10;i++){const rr=(i%2?p.s*.45:p.s)*d,a=i*Math.PI/5;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.fill();}
  else cx.fillRect(-p.s*d/2,-p.s*d/4,p.s*d,p.s*d/2);
  cx.restore();}
 raf=parts.length?requestAnimationFrame(loop):0;
}

let R;
function genQ(used,grade){
 const ok=k=>grade==="g1"?G1.includes(k):grade==="g2"?G2.includes(k):inRange(k);
 let best=null;
 for(let t=0;t<40&&!(best&&t>=10);t++){
  const segs=parse(fill(rnd(FRAMES)));
  segs.forEach((s,i)=>{ if(!s.k)return;
   if(!ok(s.k))return;
   const c=(S.mode==="kaki"?S.kw:S.kc)[s.k]||{c:0,m:0};
   let w=Math.random()*(1+c.m*1.5)/(1+c.c*.7);
   if(used.has(s.k))w*=.03;
   if(!best||w>best.w)best={w,segs,i};
  });
 }
 const s=best.segs[best.i];
 return{segs:best.segs,i:best.i,k:s.k,ans:s.r,tiles:makeTiles(s.r,s.k)};
}
function inRange(k){return S.range==="g1"?G1.includes(k):S.range==="g2"?G2.includes(k):true;}
function startRound(){
 const used=new Set();const qs=[];
 /* ぜんぶ：1年生4もん＋2年生6もんを まぜて 出す */
 const plan=S.range==="all"?shuffle(["g1","g1","g1","g1","g2","g2","g2","g2","g2","g2"]):Array(10).fill(S.range);
 for(let n=0;n<10;n++){const q=genQ(used,plan[n]);used.add(q.k);qs.push(q);}
 R={qs,idx:0,res:[],combo:0,earned:0,maxc:0,mode:S.mode};
 showQ();
}

 app.innerHTML=`<div class="screen">
  <div class="hud"><button class="quit" id="qt" aria-label="とちゅうで やめる">やめる</button><div class="mini" id="mini">${catSVG(S.lv,S.eq)}</div>
   <div class="dots">${R.qs.map((_,i)=>`<i class="${R.res[i]===true?"ok":R.res[i]===false?"ng":i===R.idx?"now":""}"></i>`).join("")}</div>

  <div class="rangelbl" style="margin:0">${{g1:"1年生の漢字",g2:"2年生の漢字",all:"1・2年生の漢字（ぜんぶ）"}[S.range]}</div>
  <div class="fevertag">★ フィーバー ★ ポイント1.5ばい</div>
  <div class="card"><span class="qno">だい${R.idx+1}もん</span><div class="sentence">${sent}</div><div class="ask">わくの 中の 漢字は なんと よむかな？</div></div>
  <div class="msg" id="msg">${q.ans.length}もじで こたえよう</div>

function drawSlots(){
 const q=R.qs[R.idx];const sl=document.querySelectorAll(".slot");
 sl.forEach((e,i)=>{const c=q.pick[i]!=null?q.tiles[q.pick[i]]:"";e.textContent=c;e.classList.toggle("f",!!c);});

function tap(i){
 const q=R.qs[R.idx];if(q.done||q.pick.includes(i)||q.pick.length>=q.ans.length)return;
 q.pick.push(i);SFX.tap(q.pick.length*2);drawSlots();
 if(q.pick.length===q.ans.length)setTimeout(check,160);
}
function backsp(){const q=R.qs[R.idx];if(q.done||!q.pick.length)return;q.pick.pop();SFX.back();drawSlots();}
function check(){
 const q=R.qs[R.idx];const got=q.pick.map(i=>q.tiles[i]).join("");const slots=document.getElementById("slots");

  q.done=true;slots.classList.add("ok");drawSlots();
  const first=q.try===1;const sec=(performance.now()-q.t0)/1000;
  if(first){R.combo++;}else R.combo=0;
  R.maxc=Math.max(R.maxc,R.combo);
  setFever(R.combo>=3);
  let pt=first?8:3;if(first&&sec<6)pt+=2;pt+=Math.min(R.combo,5);if(fever)pt=Math.round(pt*1.5);
  R.earned+=pt;R.res[R.idx]=true;c.c++;S.total++;
  const r=slots.getBoundingClientRect();const cxp=r.left+r.width/2,cyp=r.top+r.height/2;
  SFX.ok(R.combo);flash();burst(cxp,cyp,fever?90:55,fever?1.3:1);if(R.combo>=5)rain(40);
  const word=sec<6&&first?"はやい！":rnd(PRAISE);
  popWord(word,R.combo>=3?72:60,fever?"#ff9f45":"#f06aa8",(R.combo>=2?`${R.combo} コンボ！ `:"")+`+${pt}`);
  document.getElementById("cb").textContent=R.combo;
  document.getElementById("msg").textContent=`「${q.k}」は「${q.ans}」！`;
  const m=document.getElementById("mini").getBoundingClientRect();fishFly({x:cxp,y:cyp},{x:m.left+20,y:m.top+20},Math.min(8,3+R.combo));
  const mini=document.getElementById("mini");mini.innerHTML=catSVG(S.lv,S.eq,{happy:true});mini.classList.add("cat");mini.classList.add("jump");
  save();setTimeout(next,fever?1000:1150);
 }else{
  slots.classList.add("ng");shake();SFX.ng();
  if(q.try===1){
   q.try=2;document.getElementById("msg").textContent="おしい！ もう1かい！";
   setTimeout(()=>{slots.classList.remove("ng");q.pick=[];drawSlots();},550);
  }else{
   q.done=true;R.combo=0;setFever(false);R.res[R.idx]=false;c.m++;save();
   document.getElementById("cb").textContent=0;
   document.getElementById("mini").innerHTML=catSVG(S.lv,S.eq,{sad:true});
   document.getElementById("msg").innerHTML=`こたえは「<span style="color:#3fae78;font-size:24px">${q.ans}</span>」だよ`;
   setTimeout(()=>{slots.classList.remove("ng");slots.classList.add("ok");[...q.ans].forEach((ch,i)=>{slots.children[i].textContent=ch;});drawSlots();
    const t=document.getElementById("tiles");t.outerHTML=`<div class="reveal"><button class="big" id="nx">つぎへ</button></div>`;document.getElementById("nx").onclick=next;},500);
  }
 }
}
function askQuit(){

 ov.innerHTML=`<div class="ovbox"><div class="ovtitle" style="font-size:30px">とちゅうで やめる？</div>
  <div class="ovsub">${done?`ここまで ${done}もん とけたよ。<br>もらった ごはんは ちゃんと もらえるよ`:"まだ 1もんも とけていないよ"}</div>

function toPts(flat){const a=[];for(let i=0;i<flat.length;i+=2)a.push([flat[i],flat[i+1]]);return a;}
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
function resample(p,N=16){
 if(p.length<2)return Array(N).fill(p[0]||[0,0]);
 const L=plen(p);if(L<1e-6)return Array(N).fill(p[0]);
 const step=L/(N-1),out=[p[0].slice()];let acc=0,i=1,prev=p[0];
 while(out.length<N-1&&i<p.length){
  const cur=p[i],d=Math.hypot(cur[0]-prev[0],cur[1]-prev[1]);
  if(acc+d>=step){const t=(step-acc)/d;const q=[prev[0]+t*(cur[0]-prev[0]),prev[1]+t*(cur[1]-prev[1])];out.push(q);prev=q;acc=0;}
  else{acc+=d;prev=cur;i++;}
 }
 while(out.length<N)out.push(p[p.length-1].slice());
 return out;
}
function mdist(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.hypot(a[i][0]-b[i][0],a[i][1]-b[i][1]);return s/a.length;}
const REF={};
function refOf(k){
 if(REF[k])return REF[k];
 const st=(KVG[k]||[]).map(toPts);
 const rs=st.map(s=>({pts:s,rs:resample(s),len:plen(s)}));
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;st.flat().forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});

}

   const moved=user.map(([x,y])=>[(x-cu[0])*k+cr[0],(y-cu[1])*k+cr[1]]);

   if(r2.ok&&r2.d<24){learn(A,user,R);return{ok:true};}
  }
 }
 return best;
}

 const f=resample(user),b=f.slice().reverse();
 alignAdd(A,mdist(f,R.rs)<=mdist(b,R.rs)?f:b,R.rs);
}

 const all=[...G1+G2];const a=cnt(G1+G2),g=all.filter(k=>st[k]&&st[k].c>=3).length;
 const grid=src=>[...src].map(k=>{const c=st[k];const cls=c&&c.c>=3?"gold":c&&c.c>0?"on":"";return`<div class="z ${cls}" title="${k}">${k}</div>`;}).join("");
 app.innerHTML=`<div class="screen">
  <div class="topbar"><button class="iconbtn back" id="bk">← もどる</button></div>
  <h2>漢字ずかん</h2>
  <div class="modesw" id="zm"><button data-m="yomi" aria-pressed="${zMode==="yomi"}">よみ</button><button data-m="kaki" aria-pressed="${zMode==="kaki"}">かき</button></div>
  <div class="legend"><span><i style="background:#fff;border:1px solid var(--line)"></i>1かい せいかい</span><span><i style="background:var(--lemon)"></i>3かい いじょう（マスター）</span></div>
  <div class="zhead"><span>1年生の漢字</span><span><b>${cnt(G1)}</b> / 80</span></div>
  <div class="zgrid">${grid(G1)}</div>
  <div class="zhead"><span>2年生の漢字</span><span><b>${cnt(G2)}</b> / 160</span></div>
  <div class="zgrid">${grid(G2)}</div>
  <div class="earn">${zMode==="kaki"?"かけた":"よめた"} <b>${a}</b> ・ マスター <b>${g}</b></div>
 </div>`;
 document.getElementById("bk").onclick=title;
 document.querySelectorAll("#zm button").forEach(b=>b.onclick=()=>{zMode=b.dataset.m;SFX.tap(3);zukan();});
}

title();
</script>

</body>
</html>
